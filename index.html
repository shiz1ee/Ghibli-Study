<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Cabin</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:wght@600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="container stack stack--lg">
        <header class="stack">
            <h1>Style check</h1>
            <p>Temporary check for the shared styels </p>
        </header>

        <div class="grid">
            <section class="card span-7 stack">
                <h2>buttons</h2>
                <div class="row">
                    <button class="btn btn--primary" type="button">Add task</button>
                    <button class="btn btn--secondary" type="button">Start session</button>
                    <button class="btn btn--ghost" type="button">Delete</button>
                    <button class="btn btn--primary" type="button" disabled>Disabled</button>
                </div>
                <h3>Type scale</h3>
                <p>Body text size iheglieshglsheotijwoilfkgjolwikhegnlokiwuehsgoaie</p>
            </section>

            <section class="card span-5 stack">
                <h2>Input</h2>
                <div>
                    <label for="demo-task" class="label">New task</label>
                    <input type="text" class="input" id="demo-task" placeholder="Read chapter 4 of the notes">
                </div>
                <button class="btn btn--primary" type="button">ADD task</button>
            </section>
        </div>
    </main>
    
</body>
</html>
