<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Cabin</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:wght@600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="container stack stack--lg">
        <header class="header-row">
            <div class="stack">
                <h1>Study Cabin</h1>
                <p class="muted">Add a few tasks, work in focused blocks, and check things off. </p>
            </div>
            <button class="btn btn--secondary" id="theme-toggle" type="button">Dark mode</button>
        </header>

        <div class="grid">
            <section class="card span-7 stack" aria-labelledby="tasks-heading">
                <h2 id="tasks-heading">Tasks</h2>
                
                <form id="task-form" class="row">
                    <input id="task-input" class="input"  placeholder="Read chapter 4 of the notes" aria-label="New task" autocomplete="off">
                    <button class="btn btn--primary" type="submit">Add task</button>

                    <div class="task-extras">
                        <select aria-label="Priority" id="task-priority">
                            <option value="none">No priority</option>
                            <option value="low">Low</option>
                            <option value="medium">Medium</option>
                            <option value="high">High</option>
                        </select>
                        <input type="date" id="task-due" aria-label="Due date">
                    </div>
                </form>

                <div class="stack">
                    <div class="row" style="justify-content: space-between;">
                        <span class="muted" id="progress-text">0 of 0 done</span>
                    </div>
                    <div class="progress" role="progressbar" aria-labelledby="progress-text" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                        <div class="progress__fill" id="progress-fill"></div>
                    </div>
                </div>

                <ul id="task-list" class="stack"></ul>
                <p class="muted" id="empty-state">No tasks yet. Add one above.</p>
            </section>

            <aside class="card span-5 stack timer-card" aria-labelledby="timer-heading">
                <h2 id="timer-heading">Study timer</h2>
                <p class="muted" id="phase">Focus block</p>

                <div class="break-banner" id="break-banner" hidden>
                    Break time. touch grass for 5 minutes.
                </div>

                <div class="timer-wrap">
                    <svg class="arc" viewBox="0 0 200 100" aria-hidden="true">
                        <path class="arc__track" d="M 190 100 A 90 90 0 0 0 10 100"/>
                        <path class="arc__fill" id="arc-fill" d="M 190 100 A 90 90 0 0 0 10 100"/>
                    </svg>
                    <div class="timer" id="timer">25:00</div>
                </div>

                <div class="timer-controls">
                    <button class="btn btn--primary" id="toggle" type="button">Start</button>
                    <button class="btn btn--secondary" id="reset" type="button">Reset</button>
                </div>

                <div class="timer-options">
                    <label for="break-length">Break length</label>
                    <select  id="break-length">
                        <option value="300">5 min</option>
                        <option value="600">10 min</option>
                        <option value="900">15 min</option>
                    </select>
                    <button id="sound-toggle" type="button" aria-pressed="true">Sound on</button>
                </div>

                <p class="muted">Sessions completed: <span id="sessions">0</span></p>
                <p class="muted" id="status" role="status"></p>
                 
            </aside>
        </div>
    </main>
    <script src="js/app.js" defer></script>
</body>
</html>
